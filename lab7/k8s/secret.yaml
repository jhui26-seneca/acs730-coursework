# Lab 7: a Secret, to show the pattern only. The value is a deliberate placeholder.
# This repository is public, and a Secret's data is only base64-encoded, not encrypted, so a
# real credential must never be committed here. In real use it would be created on the cluster
# (kubectl create secret ...) or synced from a secrets manager, never stored in Git.
apiVersion: v1
kind: Secret
metadata:
  name: acs730-lab7-secret
  namespace: acs730-lab7
  labels:
    app: acs730-lab7-web
type: Opaque
stringData:
  PLACEHOLDER_SECRET: "not-a-real-secret"
