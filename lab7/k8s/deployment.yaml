# Lab 7: runs the Week 4 Flask app (lab4/, unchanged) as 2 Pods.
# selector.matchLabels and template.metadata.labels must match: that is how the Deployment
# (through its ReplicaSet) knows which Pods are its own. The Service uses the same label.
# The image tag here is the Week 9 build; the deploy pipeline changes it with kubectl set image
# AFTER kubectl apply, so this file never resets a newer build.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: acs730-lab7-web
  namespace: acs730-lab7
  labels:
    app: acs730-lab7-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: acs730-lab7-web
  template:
    metadata:
      labels:
        app: acs730-lab7-web
    spec:
      securityContext:
        runAsNonRoot: true          # refuse to start if the image would run as root
        runAsUser: 10001            # appuser's uid from lab4/Dockerfile (numeric, so the check can verify it)
      containers:
        - name: web
          image: acs730-lab4:week9
          imagePullPolicy: IfNotPresent   # use the copy kind load put on the node; never pull
          ports:
            - name: http
              containerPort: 8000   # gunicorn's bind port in lab4/Dockerfile
          envFrom:
            - configMapRef:
                name: acs730-lab7-config
          env:
            - name: PLACEHOLDER_SECRET
              valueFrom:
                secretKeyRef:
                  name: acs730-lab7-secret
                  key: PLACEHOLDER_SECRET
          readinessProbe:           # only send traffic once /healthz answers
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:            # restart the container if /healthz keeps failing
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:               # what the scheduler reserves on the node
              cpu: 100m
              memory: 64Mi
            limits:                 # the most the container may use
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
