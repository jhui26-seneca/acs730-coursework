---
# tasks file for webserver - each task is a module with a desired state, so a second run changes nothing.
- name: Install the web server package
  ansible.builtin.dnf:
    name: "{{ webserver_package }}"
    state: present

- name: Apply the server settings from the template
  ansible.builtin.template:
    src: acs730-httpd.conf.j2
    dest: "{{ webserver_conf_dir }}/acs730.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Restart web server

- name: Render the home page from the template
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_docroot }}/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Start the web server now and at every boot
  ansible.builtin.service:
    name: "{{ webserver_service }}"
    state: started
    enabled: true
