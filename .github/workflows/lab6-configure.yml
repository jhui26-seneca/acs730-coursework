name: lab6-configure

on:
  pull_request:
    paths: ['lab6/**', '.github/workflows/lab6-configure.yml']
  push:
    branches: [main]
    paths: ['lab6/**', '.github/workflows/lab6-configure.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab6-configure
  cancel-in-progress: false

env:
  ANSIBLE_CONFIG: ${{ github.workspace }}/lab6/ansible/ansible.cfg

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lab6/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"
      - run: terraform fmt -check -diff
      - run: terraform init -input=false -no-color
      - run: terraform validate -no-color
      - run: terraform plan -input=false -no-color

  apply-and-configure:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"
          terraform_wrapper: false
      - name: Terraform apply (tagged target, no port 22)
        working-directory: lab6/terraform
        run: |
          terraform init -input=false -no-color
          terraform apply -input=false -no-color -auto-approve
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible, boto3 and botocore into the same Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible boto3 botocore
          ansible --version
      - name: Install session-manager-plugin (pip does not provide it)
        run: |
          curl -sSfo /tmp/session-manager-plugin.deb \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version
      - name: Wait for SSM PingStatus Online
        run: bash lab6/scripts/wait-for-ssm.sh
      - name: Dynamic inventory by tag
        working-directory: lab6/ansible
        run: ansible-inventory --graph
      - name: Converge
        working-directory: lab6/ansible
        run: ansible-playbook site.yml
      - name: Second run must report changed=0
        working-directory: lab6/ansible
        run: |
          ansible-playbook site.yml | tee /tmp/run2.txt
          if grep -Eq 'changed=[1-9]' /tmp/run2.txt; then echo "Not idempotent"; exit 1; fi
