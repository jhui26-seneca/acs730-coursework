name: lab4-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one red cell must not cancel the others
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            lab4/requirements.txt
            lab4/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r lab4/requirements.txt -r lab4/requirements-dev.txt
      - name: Run the tests
        working-directory: lab4
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image-tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (with the layer cache)
        uses: docker/build-push-action@v6
        with:
          context: lab4
          load: true
          tags: acs730-lab4:${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save acs730-lab4:${{ steps.meta.outputs.image-tag }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - name: Run it and probe /healthz
        env:
          TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          docker run -d --name app -p 8000:8000 "acs730-lab4:$TAG"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1

  summary:
    needs: [test, build, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write the run summary
        run: echo "test ${{ needs.test.result }} build ${{ needs.build.result }} smoke ${{ needs.smoke.result }} tag ${{ needs.build.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Re-raise an upstream failure
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  publish:
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read      # restated on purpose: a job-level block replaces the workflow-level one
      packages: write     # the only widening in the whole workflow
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by SHA
        env:
          IMAGE: ghcr.io/${{ steps.owner.outputs.lc }}/acs730-lab4
        run: |
          TAG="sha-${GITHUB_SHA::12}"
          docker build -t "$IMAGE:$TAG" lab4/
          docker push "$IMAGE:$TAG"
