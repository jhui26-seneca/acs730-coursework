name: lab4-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one red cell must not cancel the others
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/python-deps
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the tests
        working-directory: lab4
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image-tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (with the layer cache)
        uses: docker/build-push-action@v6
        with:
          context: lab4
          load: true
          tags: acs730-lab4:${{ steps.meta.outputs.image-tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker save acs730-lab4:${{ steps.meta.outputs.image-tag }} -o image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar
          retention-days: 1

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - run: docker load -i image.tar
      - name: Run it and probe /healthz
        env:
          TAG: ${{ needs.build.outputs.image-tag }}
        run: |
          docker run -d --name app -p 8000:8000 "acs730-lab4:$TAG"
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8000/healthz && exit 0
            sleep 2
          done
          docker logs app
          exit 1

  image:
    needs: test
    uses: ./.github/workflows/docker-build.yml
    with:
      context: lab4
      image-name: acs730-lab4
      push: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write

  report:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - run: echo "built ${{ needs.image.outputs.image-ref }}"

  summary:
    needs: [test, build, smoke, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write the run summary
        run: echo "test ${{ needs.test.result }} build ${{ needs.build.result }} smoke ${{ needs.smoke.result }} image ${{ needs.image.result }} tag ${{ needs.build.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"
