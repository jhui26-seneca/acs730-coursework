name: Lab 3 Deploy

on:
  pull_request:
    paths: ['lab3/**', '.github/workflows/lab3-deploy.yml']
  push:
    branches: [main]
    paths: ['lab3/**', '.github/workflows/lab3-deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab3-terraform
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: lab3
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"

      - name: Terraform init
        run: terraform init -input=false -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Terraform apply (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -no-color -auto-approve tfplan
