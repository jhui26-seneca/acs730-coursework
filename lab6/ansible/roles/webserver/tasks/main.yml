- name: Install the web server package
  ansible.builtin.dnf:
    name: "{{ webserver_package }}"
    state: present

- name: Render the home page from the template
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ webserver_docroot }}/index.html"
    owner: root
    group: root
    mode: "0644"
  notify: Restart web server

- name: Start and enable the web server
  ansible.builtin.service:
    name: "{{ webserver_service }}"
    state: started
    enabled: true
