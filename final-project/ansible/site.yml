---
# Final project: configure the VM half of the application with the Assignment 2 role, unchanged.
# Only the page's text differs. Play vars outrank the role's defaults, so these two values replace
# defaults/main.yml's, and every other setting (package, Apache drop-in, service) is the role's own.
- name: Configure the final project backend (Apache on the VM)
  hosts: role_web
  become: true
  vars:
    webserver_title: "ACS730 final project - backend"
    webserver_message: "Served by Apache on an EC2 VM: provisioned by the Assignment 1 Terraform module, configured by the Assignment 2 Ansible role over SSM."
  roles:
    - webserver
