# Final project: the Assignment 2 role is used in place, not copied. roles_path points at
# assignment2/ansible/roles, so this play runs the same files Assignment 2 ran.
[defaults]
inventory = inventory/final.aws_ec2.yml
roles_path = ../../assignment2/ansible/roles
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2
