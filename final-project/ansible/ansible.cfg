# Final project: the Assignment 2 role is used in place, not copied. site.yml names it by its
# path (../../assignment2/ansible/roles/webserver), so this play runs the same files Assignment 2 ran.
[defaults]
inventory = inventory/final.aws_ec2.yml
host_key_checking = False
interpreter_python = auto_silent
retry_files_enabled = False

[inventory]
enable_plugins = amazon.aws.aws_ec2
